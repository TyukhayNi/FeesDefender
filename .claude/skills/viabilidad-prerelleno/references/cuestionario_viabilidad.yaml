# === FICHERO GENERADO — no editar a mano (ver cabecera 'descripcion') ===
cuestionario_viabilidad:
  descripcion: 'VISTA de la skill viabilidad-prerelleno. GENERADO desde data/_plantillas/cuestionario_viabilidad.yaml
    — NO editar a mano; regenerar con scripts/sync_cuestionario_from_canon.py. Columnas fijas de plantilla
    (NO TOCAR): SECCIÓN, ID, PREGUNTA, OBJETIVO PROBATORIO, TIPO, FUENTE PROBABLE, HITO.'
  regla_enrutamiento: 'clase_fuente es un DEFAULT: ''documental'' = pre-rellenable si un documento de
    00_Input la responde; ''testifical'' = el documento no la acredita → ¿PENDIENTE ENTREVISTA?=sí. En
    ejecución, si un documento NO resuelve una pregunta documental, también pasa a ¿PENDIENTE?=sí. Nunca
    se rellena por inferencia.'
  terminologia:
    propietario: quien ofrece el bien (nunca 'vendedor')
    buscador: quien busca (nunca 'comprador' ni 'arrendatario')
  secciones:
  - seccion: 1. Captación del inmueble (encargo)
