[project]
name = "feesdefender"
version = "0.1.0"
description = "FeesDefender — Motor de análisis y reclamación de honorarios inmobiliarios"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nikolai Tyukhay" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]
markers = [
    "slow: test lento (Presidio/spaCy/OCR real o PDF pesado de core/anon/). Omitido salvo --runslow.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
