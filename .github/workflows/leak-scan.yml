# Escaneo de fugas en servidor (secretos + rutas vetadas + PII opcional).
# Red de seguridad para lo que empuje una máquina/Cowork SIN el hook local.
# Detección siempre; para que además PREVENGA (bloquee el merge a main), activar
# branch protection en main con este check como obligatorio — requiere GitHub Pro
# en repos privados. Ver docs/SEGURIDAD_DATOS.md.
name: leak-scan

# Solo en push: la gitleaks-action revienta en contexto `pull_request` (llama a
# /pulls/N/commits y falla). El check del evento push se reporta sobre el head SHA
# del PR, así que satisface igual el gate de branch protection al mergear.
on:
  push:

permissions:
  contents: read

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historia completa: gitleaks escanea los commits del evento

      - name: gitleaks (secretos)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: leak-guard (rutas vetadas + PII si hay blocklist)
        env:
          # Opcional: define el secret PII_BLOCKLIST (nombres/emails reales, uno por
          # línea) para que el CI escanee PII sin que la lista viva en el repo.
          PII_BLOCKLIST: ${{ secrets.PII_BLOCKLIST }}
        run: |
          # El paso solo puede dar verde si ha ESCANEADO algo. Por eso la lista de ficheros va
          # primero a un fichero y se exige que no esté vacía: con `git ls-files -z | xargs -0 -r`,
          # un listado que fallaba —o que salía vacío con código 0, como hace git sin índice—
          # dejaba a xargs sin nada que correr y el paso en verde sin haber mirado un solo
          # fichero (plan 2026-09-26, git que falla en voz alta, R1/H-06). Un git que falla corta
          # el paso por el `-e` con que GitHub corre un `run:`; y si no, lo corta la lista vacía.
          if [ -n "$PII_BLOCKLIST" ]; then
            mkdir -p data/_config
            printf '%s' "$PII_BLOCKLIST" > data/_config/pii_blocklist.txt
          else
            echo "::error title=leak-scan::PII_BLOCKLIST no configurado — el escaneo de PII en CONTENIDO no puede correr. La barrera server-side de PII queda inactiva. Crea el secret PII_BLOCKLIST (ver docs/SEGURIDAD_DATOS.md)."
            exit 1
          fi
          lista="$(mktemp)"
          git ls-files -z > "$lista"
          if [ ! -s "$lista" ]; then
            echo "::error title=leak-scan::git ls-files no ha devuelto ningún fichero: el escaneo no ha mirado nada, y eso no es un verde."
            exit 1
          fi
          xargs -0 -r python scripts/precommit_leak_guard.py < "$lista"
